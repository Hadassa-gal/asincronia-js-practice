<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="./src/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./src/main.js" defer></script>
    <title>calculadora de imc</title>
  </head>
  <body>
    <div id="container" class="container">
      <p class="titulo">CALCULADORA DE IMC</p>
      <form class="container_3" id="form">
        <div class="container_1">
          <div class="container_up targeta">
            <h2>EDAD</h2>
            <input type="text" placeholder="ej: 15" id="edad" name="edad" class="edad barra">
          </div>
          <div class="container_down targeta">
            <h2>NOMBRE</h2>
            <input type="text" placeholder="ej: juan" id="nombre" name="nombre" class="nombre barra">
          </div>
        </div>
        <div class="container_1">
          <div class="container_up targeta"">
            <h2>PESO</h2>
            <input type="number" placeholder="ej: 55" name="peso" id="peso" class="peso barra">
          </div>
          <div class="container_down targeta">
            <h2>ESTATURA</h2>
            <input type="number" placeholder="ej: 1.60" name="estatura" id="altura" class="estatura barra">
          </div>
        </div>
        <button type="submit" id="calcular" class="btn">calcular</button>
      </form>
      <div class="container2" id="hidden">
      </div>
    </div>
  </body>
</html>
